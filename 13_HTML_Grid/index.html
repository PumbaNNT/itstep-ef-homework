<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 70px 17px 22px;
            background: #2b343d;
            font-family: Segoe UI, Arial, sans-serif;
        }

        /* сітка 6 x 4 */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(4, 236px);
            gap: 22px;
        }

        .item {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(45deg, #fee5a6 0%, #fdb3a8 45%, #fd80b0 85%);
        }

        /* ромбик з номером */
        .item span {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            transform: rotate(45deg);
            background: linear-gradient(135deg, #fff, #dcdcdc);
            border-radius: 4px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .25);
            font-weight: bold;
        }

        .item span b { transform: rotate(-45deg); }

        /* великі блоки */
        .i1 { grid-column: 2 / 5; grid-row: 1 / 3; background: linear-gradient(45deg, #c9a8f5, #fe7ff5); }
        .i2 { grid-column: 3 / 5; grid-row: 3 / 5; background: linear-gradient(45deg, #fd84f5, #c8b0f8); }
        .i3 { grid-column: 5 / 7; grid-row: 1;     background: linear-gradient(45deg, #72c0f8, #7eeedd); }
        .i4 { grid-column: 5 / 7; grid-row: 2;     background: linear-gradient(45deg, #7eeedd, #72c0f8); }

        /* маленькі блоки */
        .i5  { grid-column: 1; grid-row: 1; }
        .i6  { grid-column: 1; grid-row: 2; }
        .i7  { grid-column: 1; grid-row: 3; }
        .i8  { grid-column: 1; grid-row: 4; }
        .i9  { grid-column: 2; grid-row: 3; }
        .i10 { grid-column: 2; grid-row: 4; }
        .i11 { grid-column: 5; grid-row: 3; }
        .i12 { grid-column: 6; grid-row: 3; }
        .i13 { grid-column: 5; grid-row: 4; }
        .i14 { grid-column: 6; grid-row: 4; }
    </style>
</head>
<body>
    <div class="grid">
        <div class="item i1"><span><b>1</b></span></div>
        <div class="item i2"><span><b>2</b></span></div>
        <div class="item i3"><span><b>3</b></span></div>
        <div class="item i4"><span><b>4</b></span></div>
        <div class="item i5"><span><b>5</b></span></div>
        <div class="item i6"><span><b>6</b></span></div>
        <div class="item i7"><span><b>7</b></span></div>
        <div class="item i8"><span><b>8</b></span></div>
        <div class="item i9"><span><b>9</b></span></div>
        <div class="item i10"><span><b>10</b></span></div>
        <div class="item i11"><span><b>11</b></span></div>
        <div class="item i12"><span><b>12</b></span></div>
        <div class="item i13"><span><b>13</b></span></div>
        <div class="item i14"><span><b>14</b></span></div>
    </div>
</body>
</html>
