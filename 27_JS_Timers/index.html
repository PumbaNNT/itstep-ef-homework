<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>JS - setTimeout, setInterval, Date, Math</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 760px; margin: 20px auto; }
        section { border: 1px solid #ddd; border-radius: 8px; padding: 10px 16px; margin: 12px 0; }
        h2 { font-size: 18px; margin: 6px 0; }
        .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
        .result { font-weight: bold; min-width: 40px; }
        input { padding: 4px; width: 90px; }
        #clock { font: bold 40px Consolas, monospace; }
        #blink { font-size: 28px; font-weight: bold; }
    </style>
</head>
<body>
<h1>setTimeout, setInterval, Date, Math</h1>

<section>
    <h2>Частина 1</h2>
    <div class="row"><button id="btn1-1">1.1 Повідомлення через 3 с</button><span class="result" id="p1-1"></span></div>
    <div class="row"><input id="name" placeholder="Ім'я"><button id="btn1-2">1.2 Привітатися через 2 с</button><span class="result" id="p1-2"></span></div>
</section>

<section>
    <h2>Частина 2</h2>
    <div class="row"><button id="btn2-1">2.1 Лічильник 1..10</button><span class="result" id="p2-1"></span></div>
    <div class="row"><button id="btn2-2">2.2 Відлік 10..0</button><span class="result" id="p2-2"></span></div>
</section>

<section>
    <h2>Частина 3</h2>
    <div class="row">3.1 Сьогодні: <span class="result" id="p3-1"></span></div>
    <div class="row"><input id="year" type="number" value="2005"><button id="btn3-2">3.2 Порахувати вік</button><span class="result" id="p3-2"></span></div>
    <div class="row">3.3 <span class="result" id="p3-3"></span></div>
</section>

<section>
    <h2>Частина 4</h2>
    <div class="row"><button id="btn4-1">4.1 Випадкове 1..100</button><span class="result" id="p4-1"></span></div>
    <div class="row"><button id="btn4-2">4.2 Кинути кубик</button><span class="result" id="p4-2"></span></div>
    <div class="row">
        <input id="a" type="number" value="4"><input id="b" type="number" value="17"><input id="c" type="number" value="9">
        <button id="btn4-3">4.3 Найбільше</button><span class="result" id="p4-3"></span>
    </div>
</section>

<section>
    <h2>Частина 5 — таймер до дати (за замовчуванням до Нового року)</h2>
    <div class="row"><input id="target" type="datetime-local" style="width:auto"><button id="btn5">Запустити</button></div>
    <div class="row result" id="p5"></div>
</section>

<section>
    <h2>Частина 6</h2>
    <div id="clock">00:00:00</div>
    <div id="blink">Мигалка тексту</div>
</section>

<script src="script.js"></script>
</body>
</html>
