<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 1 - Подія (адаптивна)</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: #004242;
            color: #fff;
            font-family: Segoe UI, Arial, sans-serif;
        }

        .page { padding: 125px 125px 80px; }

        .crumbs {
            color: #a9bcbc;
            font-size: 24px;
        }

        .crumbs a { color: inherit; text-decoration: none; }

        h1 {
            max-width: 720px;
            margin: 30px 0 75px;
            font-size: 64px;
            line-height: 1.3;
        }

        .meta {
            display: flex;
            align-items: center;
            gap: 38px;
        }

        .avatar {
            flex: 0 0 98px;
            width: 98px;
            height: 98px;
            border: 5px solid #4b4f55;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 38%, #d4d7db 0 22%, transparent 23%),
                radial-gradient(ellipse at 50% 100%, #f2c41f 0 45%, transparent 46%),
                #fff;
        }

        .info {
            display: flex;
            gap: 38px;
            font-size: 19px;
            line-height: 1.4;
        }

        .info span { display: block; color: #a9bcbc; }

        /* менше 600 px - інше компонування, відступи і шрифти */
        @media (max-width: 599px) {
            .page { padding: 40px 38px; }

            .crumbs { font-size: 22px; }

            h1 {
                margin: 25px 0 60px;
                font-size: 34px;
            }

            .meta { align-items: flex-start; gap: 60px; }

            /* 4 пункти у дві колонки, порядок як на макеті */
            .info {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 22px 60px;
                white-space: nowrap;
                font-size: 18px;
            }

            .info .updated   { order: 1; }
            .info .author    { order: 2; }
            .info .comments  { order: 3; }
            .info .published { order: 4; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="crumbs"><a href="#">Home</a> / <a href="#">Articles</a> /</div>
        <h1>The Difference Between Responsive and Adaptive Design</h1>

        <div class="meta">
            <div class="avatar"></div>
            <div class="info">
                <div class="author"><span>Author</span>Geoff Graham</div>
                <div class="comments"><span>49 Comments</span>Go to comments</div>
                <div class="published"><span>Published</span>Nov 11, 2018</div>
                <div class="updated"><span>Updated</span>Nov 17, 2018</div>
            </div>
        </div>
    </div>
</body>
</html>
